<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Composant — Contre-offre (default)</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../price-option/price-option.css">
<link rel="stylesheet" href="../input-text-field/input-text-field.css">
<link rel="stylesheet" href="contre-offre.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--spark-background-variant);
  min-height: 100vh;
  padding: 24px 16px;
  font-family: 'LBC Denim INK', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
}
.component-wrap {
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
}
</style>
</head>
<body>

<div class="component-wrap">
  <div class="contre-offre">

    <!-- Header -->
    <div class="co-header">
      <span class="co-title">Proposer un nouveau prix</span>
      <div class="co-chevron">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M2.32544 7.30343C2.75935 6.89886 3.46287 6.89886 3.89679 7.30343L12 14.7836L20.1032 7.30343C20.5371 6.89886 21.2406 6.89886 21.6746 7.30343C22.1085 7.70801 22.1085 8.36396 21.6746 8.76853L13.3338 16.4702C13.1638 16.6352 12.9602 16.7671 12.7348 16.8581C12.5028 16.9517 12.2528 17 12 17C11.7472 17 11.4972 16.9517 11.2652 16.8581C11.0399 16.7671 10.8363 16.6353 10.6662 16.4702L2.32544 8.76853C1.89152 8.36396 1.89152 7.70801 2.32544 7.30343Z" fill="#3A4757"/>
        </svg>
      </div>
    </div>

    <!-- Carte prix -->
    <div class="co-price-card">

      <span class="co-last-offer">Dernière offre : 92 €</span>

      <img class="co-gauge-img"
           src="../../assets/images/jauge-prix.png"
           alt="Distribution des prix : 85 € — 92 € — 160€">

      <div class="co-source">
        <img src="../icons/alert-info.svg" alt="" width="16" height="16">
        <a href="#">Comment est calculé la fourchette de prix</a>
      </div>

      <!-- Mon offre -->
      <div class="co-my-offer">
        <span class="co-my-offer-title">Mon offre</span>

        <div class="co-radio-group">

          <div class="price-option" onclick="selectOffer(this, 'option1')">
            <div class="price-option-content">
              <span class="price-option-title">86,25 €</span>
              <span class="price-option-subtitle">Réduction de 25%</span>
            </div>
          </div>

          <div class="price-option selected" onclick="selectOffer(this, 'option2')">
            <div class="price-option-content">
              <span class="price-option-title">80,25 €</span>
              <span class="price-option-subtitle">Réduction de 30%</span>
            </div>
          </div>

          <div class="price-option" onclick="selectOffer(this, 'other')">
            <div class="price-option-content">
              <span class="price-option-title">Autre prix</span>
            </div>
          </div>

        </div>

        <!-- Input prix libre (visible si "Autre prix" sélectionné) -->
        <div class="co-custom-input" id="custom-input">
          <div class="itf-wrapper">
            <label class="itf-label" for="prix-libre">Proposer un prix (obligatoire)</label>
            <div class="itf-field">
              <input class="itf-input" type="text" id="prix-libre" inputmode="decimal" placeholder="ex : 78">
              <div class="itf-separator"></div>
              <span class="itf-suffix">€</span>
            </div>
          </div>
        </div>

      </div>

    </div>

    <!-- CTA -->
    <button class="co-cta">Envoyer</button>

  </div>
</div>

<script>
function selectOffer(card, key) {
  document.querySelectorAll('.co-radio-group .price-option').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  const input = document.getElementById('custom-input');
  input.classList.toggle('visible', key === 'other');
}
</script>

</body>
</html>
