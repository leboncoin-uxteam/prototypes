<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Messagerie — Notif vendeur</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/offer-module/offer-module.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: #1a1a1a;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'LBC Denim INK', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
}

/* ── Cadre téléphone ── */
.phone {
  position: relative;
  width: 375px;
  height: 812px;
  overflow: hidden;
  border-radius: 40px;
  box-shadow: 0 32px 80px rgba(0,0,0,.6);
  flex-shrink: 0;
}
@media (max-height: 860px) {
  .phone { border-radius: 0; width: 100vw; height: 100dvh; }
  body { background: var(--spark-surface); }
}

/* ── Screenshot conversation (fond statique) ── */
.convo-bg {
  position: absolute;
  top: 0; left: 0; right: 0;
  bottom: 0;
}
.convo-bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}

/* ── Zone module + barre saisie (overlay bas d'écran) ── */
.bottom-overlay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
}

/* Dégradé de transition pour fondre avec la conversation */
.bottom-overlay::before {
  content: '';
  display: block;
  height: 32px;
  background: linear-gradient(to bottom, transparent, var(--spark-background-variant));
  pointer-events: none;
}

/* Fond du module */
.module-wrapper {
  background: var(--spark-background-variant);
  padding: 0 0 8px;
}

/* ── Barre saisie statique ── */
.input-bar {
  background: var(--spark-surface);
  border-top: 1px solid var(--spark-outline);
  padding: 10px 16px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.input-bar-add {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--spark-outline);
  background: none;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.input-bar-add svg { display: block; }
.input-bar-field {
  flex: 1;
  height: 36px;
  border: 1px solid var(--spark-outline);
  border-radius: 999px;
  padding: 0 14px;
  font-size: 14px;
  color: var(--spark-on-background-variant);
  background: var(--spark-surface);
  display: flex; align-items: center;
}
.input-bar-send {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--spark-main);
  border: none;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.input-bar-send svg { display: block; }

/* ── Fix outline boutons ── */
button,
button:focus,
button:focus-visible,
button:active {
  outline: none !important;
  box-shadow: none !important;
  -webkit-tap-highlight-color: transparent;
}

/* ── Bouton envoi désactivé ── */
.input-bar-send {
  opacity: 0.4;
  cursor: default;
}

</style>
</head>
<body>

<div class="phone">

  <!-- Fond : screenshot messagerie -->
  <div class="convo-bg">
    <img src="../assets/images/messagerie-bg.png" alt="Conversation">
  </div>

  <!-- Overlay bas : module offre + barre saisie -->
  <div class="bottom-overlay">

    <div class="module-wrapper">

      <!-- ── État OUVERT ── -->
      <div id="state-open" class="offer-module">

        <div class="offer-header">
          <div class="offer-seller">
            <img class="offer-avatar" src="../assets/images/avatar-julien.png" alt="Julien Dereims">
            <div class="offer-seller-meta">
              <span class="offer-seller-name">Julien Dereims</span>
              <span class="offer-seller-star">★</span>
              <span>3,8</span>
              <span class="offer-seller-label">vous fait une offre</span>
            </div>
          </div>
          <div class="offer-chevron" onclick="toggleModule()" style="cursor:pointer">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M2.32544 7.30343C2.75935 6.89886 3.46287 6.89886 3.89679 7.30343L12 14.7836L20.1032 7.30343C20.5371 6.89886 21.2406 6.89886 21.6746 7.30343C22.1085 7.70801 22.1085 8.36396 21.6746 8.76853L13.3338 16.4702C13.1638 16.6352 12.9602 16.7671 12.7348 16.8581C12.5028 16.9517 12.2528 17 12 17C11.7472 17 11.4972 16.9517 11.2652 16.8581C11.0399 16.7671 10.8363 16.6353 10.6662 16.4702L2.32544 8.76853C1.89152 8.36396 1.89152 7.70801 2.32544 7.30343Z" fill="#3A4757"/>
            </svg>
          </div>
        </div>

        <div class="offer-price-card">
          <div class="offer-price-row">
            <div class="offer-price-left">
              <div>
                <span class="offer-price-main">92€</span>
                <span class="offer-price-original"> au lieu de 115€</span>
              </div>
              <div class="offer-price-discount">Soit 20% du prix (- 23€)</div>
            </div>
            <div class="offer-badge">⏱ 42h restantes</div>
          </div>

          <img class="offer-histogram-img"
               src="../assets/images/jauge-prix.png"
               alt="Distribution des prix"
               style="width:100%;height:auto;display:block;">

          <div class="offer-source">
            <img class="source-icon" src="../components/icons/alert-info.svg" alt="" width="16" height="16">
            <a href="#">Comment est calculée la fourchette de prix ?</a>
          </div>
        </div>

        <div class="offer-ctas">
          <button class="offer-btn-secondary">Autres options</button>
          <button class="offer-btn-primary">Accepter</button>
        </div>

      </div><!-- /state-open -->

      <!-- ── État FERMÉ ── -->
      <div id="state-closed" class="offer-module" style="display:none">

        <div class="offer-closed-row">
          <div class="offer-closed-price">
            <span class="offer-closed-price-main">92€</span>
            <span class="offer-closed-price-sub">au lieu de 115€</span>
          </div>
          <button class="offer-closed-btn-accept">Accepter</button>
          <div class="offer-chevron offer-chevron--up" onclick="toggleModule()" style="cursor:pointer">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M2.32544 7.30343C2.75935 6.89886 3.46287 6.89886 3.89679 7.30343L12 14.7836L20.1032 7.30343C20.5371 6.89886 21.2406 6.89886 21.6746 7.30343C22.1085 7.70801 22.1085 8.36396 21.6746 8.76853L13.3338 16.4702C13.1638 16.6352 12.9602 16.7671 12.7348 16.8581C12.5028 16.9517 12.2528 17 12 17C11.7472 17 11.4972 16.9517 11.2652 16.8581C11.0399 16.7671 10.8363 16.6353 10.6662 16.4702L2.32544 8.76853C1.89152 8.36396 1.89152 7.70801 2.32544 7.30343Z" fill="#3A4757"/>
            </svg>
          </div>
        </div>

      </div><!-- /state-closed -->

    </div><!-- /module-wrapper -->

    <!-- Barre de saisie statique -->
    <div class="input-bar">
      <div class="input-bar-add">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2v12M2 8h12" stroke="#706e6e" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="input-bar-field">Écrivez votre message</div>
      <div class="input-bar-send">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M13.5 8L2.5 3l2 5-2 5 11-5z" fill="#fff"/>
        </svg>
      </div>
    </div>

  </div><!-- /bottom-overlay -->

</div><!-- /phone -->

<script>
function toggleModule() {
  const open   = document.getElementById('state-open');
  const closed = document.getElementById('state-closed');
  const isOpen = open.style.display !== 'none';
  open.style.display   = isOpen ? 'none'  : 'flex';
  closed.style.display = isOpen ? 'flex'  : 'none';
}
</script>

</body>
</html>
