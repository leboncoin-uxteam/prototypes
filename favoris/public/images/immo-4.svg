<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#2C2C2C"/>
  <!-- Murs béton -->
  <rect width="400" height="300" fill="#3A3A3A"/>
  <!-- Fenêtres industrielles hautes -->
  <rect x="20" y="20" width="80" height="120" fill="#87CEEB" rx="1"/>
  <rect x="110" y="20" width="80" height="120" fill="#87CEEB" rx="1"/>
  <rect x="200" y="20" width="80" height="120" fill="#C8E8F0" rx="1"/>
  <rect x="290" y="20" width="90" height="120" fill="#87CEEB" rx="1"/>
  <!-- Grille fenêtres -->
  <line x1="60" y1="20" x2="60" y2="140" stroke="#555" stroke-width="2"/>
  <line x1="150" y1="20" x2="150" y2="140" stroke="#555" stroke-width="2"/>
  <line x1="240" y1="20" x2="240" y2="140" stroke="#555" stroke-width="2"/>
  <line x1="335" y1="20" x2="335" y2="140" stroke="#555" stroke-width="2"/>
  <line x1="20" y1="80" x2="380" y2="80" stroke="#555" stroke-width="2"/>
  <!-- Sol béton ciré -->
  <rect x="0" y="220" width="400" height="80" fill="#4A4A4A"/>
  <!-- Poutre métallique -->
  <rect x="0" y="155" width="400" height="12" fill="#666"/>
  <rect x="0" y="158" width="400" height="4" fill="#888"/>
  <!-- Canapé cuir -->
  <rect x="50" y="175" width="180" height="55" fill="#1A1A1A" rx="3"/>
  <rect x="50" y="162" width="180" height="18" fill="#111" rx="2"/>
  <rect x="50" y="175" width="12" height="55" fill="#111" rx="2"/>
  <rect x="218" y="175" width="12" height="55" fill="#111" rx="2"/>
  <!-- Lampe suspendue -->
  <line x1="300" y1="0" x2="300" y2="155" stroke="#888" stroke-width="2"/>
  <ellipse cx="300" cy="160" rx="25" ry="10" fill="#D4AF37"/>
  <circle cx="300" cy="158" r="8" fill="#FFF5CC" opacity="0.9"/>
  <text x="200" y="292" font-family="Arial" font-size="11" fill="#AAA" text-anchor="middle">Loft — Bordeaux</text>
</svg>
