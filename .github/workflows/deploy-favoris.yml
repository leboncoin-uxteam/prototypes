name: Deploy Favoris to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['favoris/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: favoris/package-lock.json
      - run: npm ci
        working-directory: favoris
      - run: npm run build
        working-directory: favoris
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: favoris/out
      - id: deployment
        uses: actions/deploy-pages@v4
