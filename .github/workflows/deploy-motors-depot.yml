name: Deploy Motors Depot to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['motors-depot-annonce-pro/**', '.github/workflows/deploy-motors-depot.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: favoris/package-lock.json

      # Build favoris
      - name: Install favoris dependencies
        run: npm ci
        working-directory: favoris

      - name: Build favoris
        run: npm run build
        working-directory: favoris

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: motors-depot-annonce-pro/package-lock.json

      # Build motors-depot
      - name: Install motors-depot dependencies
        run: npm ci
        working-directory: motors-depot-annonce-pro

      - name: Build motors-depot
        run: npm run build
        working-directory: motors-depot-annonce-pro
        env:
          NEXT_PUBLIC_BASE_PATH: /prototypes/motors-depot-annonce-pro

      # Assemble site complet
      - name: Assemble site
        run: |
          mkdir -p _site
          find . -maxdepth 1 \
            -not -name '.' \
            -not -name '_site' \
            -not -name '.git' \
            -not -name '.github' \
            -not -name 'favoris' \
            -not -name 'motors-depot-annonce-pro' \
            -exec cp -r {} _site/ \;
          cp -r favoris/out _site/favoris
          cp -r motors-depot-annonce-pro/out _site/motors-depot-annonce-pro

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
